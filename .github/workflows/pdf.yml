name: Generate PDF Resume

on:
  push:
    branches:
      - main  # Если ваша главная ветка называется master, замените main на master

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий на виртуальную машину (КРИТИЧЕСКИ ВАЖНО!)
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Настраиваем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Устанавливаем системные зависимости для WeasyPrint
      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-pip python3-setuptools python3-wheel python3-cffi libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      # 4. Устанавливаем WeasyPrint
      - name: Install Python packages
        run: |
          pip install weasyprint

      # 5. Запускаем генерацию PDF
      - name: Run PDF Generator
        run: python generate_pdf.py

      # 6. Сохраняем и отправляем сгенерированный PDF обратно в репозиторий
      - name: Commit and Push PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Resume_Alexander_Masyuk.pdf
          git commit -m "Auto-generate PDF resume" || exit 0
          git push
