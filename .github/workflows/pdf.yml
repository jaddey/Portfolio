name: Generate PDF Resume

on:
  push:
    paths:
      - 'profile.json'
      - 'photo.jpg'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-pip python3-setuptools python3-wheel python3-cffi libcairo2 pango1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
          pip install weasyprint

      - name: Generate PDF
        run: python generate_pdf.py

      - name: Commit and push PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Resume_Alexander_Masyuk.pdf
          git commit -m "Auto-generate PDF Resume" || exit 0
          git push
