<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Runner - Tron Light Cycle Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff007f;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #00fff5;
        }
        #theme-indicator {
            font-size: 16px;
            color: #00fff5;
            margin-top: 5px;
            text-shadow: 0 0 5px #00fff5;
        }
        #goal {
            font-size: 14px;
            color: #ffd700;
            text-shadow: 0 0 5px #ffd700;
        }

        #leaderboard-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 0, 20, 0.75);
            color: #00fff5;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            min-width: 200px;
        }
        #leaderboard-box h3 {
            margin: 0 0 10px 0;
            color: #ff007f;
            font-size: 18px;
            text-align: center;
            text-shadow: 0 0 8px #ff007f;
        }
        #leaderboard-list {
            padding-left: 20px;
            margin: 0;
            font-size: 14px;
        }
        #leaderboard-list li {
            margin-bottom: 4px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        Очки: <span id="score">0</span>
        <div id="theme-indicator">Локация: Synthwave Sunset</div>
        <div id="goal">Цель: 1 000 000</div>
    </div>

    <div id="leaderboard-box">
        <h3>ТОП 10 РЕКОРДОВ</h3>
        <ol id="leaderboard-list"></ol>
    </div>

<script>
    // --- ДИНАМИЧЕСКИЙ МУЗЫКАЛЬНЫЙ ДВИЖОК SYNTHWAVE ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let isMusicPlaying = false;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
            startAdvancedSynthwaveMusic();
        }
    }

    function startAdvancedSynthwaveMusic() {
        if (isMusicPlaying) return;
        isMusicPlaying = true;

        const progressionA = [
            { bass: 110.00, lead: [220.00, 261.63, 329.63, 392.00] },
            { bass: 87.31,  lead: [174.61, 220.00, 261.63, 329.63] },
            { bass: 130.81, lead: [261.63, 329.63, 392.00, 523.25] },
            { bass: 98.00,  lead: [196.00, 246.94, 293.66, 392.00] }
        ];

        const progressionB = [
            { bass: 146.83, lead: [293.66, 349.23, 440.00, 523.25] },
            { bass: 110.00, lead: [220.00, 261.63, 329.63, 440.00] },
            { bass: 123.47, lead: [246.94, 293.66, 369.99, 493.88] },
            { bass: 87.31,  lead: [174.61, 220.00, 261.63, 349.23] }
        ];

        let currentProgression = progressionA;
        let step = 0;
        let measure = 0;

        function playMusicStep() {
            if (!audioCtx || audioCtx.state === 'suspended') return;

            const now = audioCtx.currentTime;
            
            if (step % 32 === 0) {
                measure++;
                currentProgression = (measure % 2 === 0) ? progressionA : progressionB;
            }

            const currentChordIndex = Math.floor((step % 32) / 8);
            const currentChord = currentProgression[currentChordIndex];

            // 1. БАС
            if (step % 2 === 0) {
                const bassOsc = audioCtx.createOscillator();
                const bassFilter = audioCtx.createBiquadFilter();
                const bassGain = audioCtx.createGain();

                bassOsc.type = 'sawtooth';
                bassOsc.frequency.setValueAtTime(currentChord.bass / 2, now);

                bassFilter.type = 'lowpass';
                bassFilter.frequency.setValueAtTime(400, now);
                bassFilter.frequency.exponentialRampToValueAtTime(120, now + 0.15);

                bassGain.gain.setValueAtTime(0.09, now);
                bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                bassOsc.connect(bassFilter);
                bassFilter.connect(bassGain);
                bassGain.connect(audioCtx.destination);

                bassOsc.start(now);
                bassOsc.stop(now + 0.2);
            }

            // 2. АРПЕДЖИО
            const noteInChord = currentChord.lead[step % currentChord.lead.length];
            const leadOsc = audioCtx.createOscillator();
            const leadGain = audioCtx.createGain();

            leadOsc.type = 'square';
            leadOsc.frequency.setValueAtTime(noteInChord, now);

            const isChorus = (measure % 2 !== 0);
            const leadVol = isChorus ? 0.035 : 0.02;

            leadGain.gain.setValueAtTime(leadVol, now);
            leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            leadOsc.connect(leadGain);
            leadGain.connect(audioCtx.destination);

            leadOsc.start(now);
            leadOsc.stop(now + 0.14);

            // 3. ХЭЙ-ХЭТ
            if (step % 4 === 2) {
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'highpass';
                noiseFilter.frequency.value = 5000;

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.015, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                noise.start(now);
            }

            step++;
            const tempo = Math.max(110, 140 - Math.floor(score / 50));
            setTimeout(playMusicStep, tempo);
        }

        playMusicStep();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'slide') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.setValueAtTime(1200, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    // --- ТАБЛИЦА РЕКОРДОВ ---
    function getLeaderboard() {
        const stored = localStorage.getItem('runner_top10');
        return stored ? JSON.parse(stored) : [];
    }

    function updateLeaderboardUI() {
        const listEl = document.getElementById('leaderboard-list');
        listEl.innerHTML = '';
        const scores = getLeaderboard();
        
        scores.forEach(item => {
            const li = document.createElement('li');
            li.innerText = `${item.name}: ${item.score}`;
            listEl.appendChild(li);
        });

        if (scores.length === 0) {
            listEl.innerHTML = '<li>Пока нет рекордов</li>';
        }
    }

    function saveScore(newScore) {
        let scores = getLeaderboard();
        const finalScore = Math.floor(newScore);

        if (scores.length < 10 || finalScore > scores[scores.length - 1].score) {
            const name = prompt('Поздравляем! Вы вошли в ТОП-10! Введите ваше имя:', 'Игрок') || 'Аноним';
            scores.push({ name: name.substring(0, 10), score: finalScore });
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 10);

            localStorage.setItem('runner_top10', JSON.stringify(scores));
            updateLeaderboardUI();
        }
    }

    updateLeaderboardUI();

    // --- СЦЕНА THREE.JS ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f051d);
    scene.fog = new THREE.FogExp2(0x0f051d, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3.5, 6);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Свет
    const dirLight = new THREE.DirectionalLight(0xffaa00, 1.2);
    dirLight.position.set(0, 10, -20);
    scene.add(dirLight);

    const ambientLight = new THREE.AmbientLight(0x400055, 0.8);
    scene.add(ambientLight);

    // --- СИНТВЕЙВ СОЛНЦЕ ---
    function createSunTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const gradient = ctx.createLinearGradient(0, 0, 0, 512);
        gradient.addColorStop(0, '#ffcc00');
        gradient.addColorStop(0.5, '#ff007f');
        gradient.addColorStop(1, '#aa00ff');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(256, 256, 240, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000000';
        let lineY = 260;
        let lineH = 4;
        while (lineY < 500) {
            ctx.fillRect(0, lineY, 512, lineH);
            lineY += lineH + 8;
            lineH += 3;
        }

        return new THREE.CanvasTexture(canvas);
    }

    const sunGeo = new THREE.PlaneGeometry(35, 35);
    const sunMat = new THREE.MeshBasicMaterial({ 
        map: createSunTexture(), 
        transparent: true,
        depthWrite: false
    });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    sun.position.set(0, 10, -90);
    scene.add(sun);

    // --- ТЕКСТУРА ПЛОСКОЙ ПАЛЬМЫ ---
    function createPalmTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.strokeStyle = '#00fff5';
        ctx.shadowColor = '#00fff5';
        ctx.shadowBlur = 12;
        ctx.lineWidth = 6;

        ctx.beginPath();
        ctx.moveTo(128, 500);
        ctx.quadraticCurveTo(100, 300, 128, 180);
        ctx.stroke();

        const leafAngles = [-0.8, -0.4, 0, 0.4, 0.8, -1.1, 1.1];
        leafAngles.forEach(angle => {
            ctx.beginPath();
            ctx.moveTo(128, 180);
            const endX = 128 + Math.sin(angle) * 90;
            const endY = 180 - Math.cos(angle) * 70;
            const cpX = 128 + Math.sin(angle) * 50;
            const cpY = 180 - Math.cos(angle) * 90;
            ctx.quadraticCurveTo(cpX, cpY, endX, endY);
            ctx.stroke();
        });

        return new THREE.CanvasTexture(canvas);
    }

    const palmTexture = createPalmTexture();

    // --- ЗВЕЗДНОЕ НЕБО ---
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 400;
    const starPositions = new Float32Array(starCount * 3);

    for(let i = 0; i < starCount * 3; i += 3) {
        starPositions[i] = (Math.random() - 0.5) * 200;
        starPositions[i+1] = Math.random() * 50 + 5;
        starPositions[i+2] = -Math.random() * 100 - 20;
    }

    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
    const starField = new THREE.Points(starsGeo, starsMat);
    scene.add(starField);

    // --- ДИНАМИЧЕСКИЕ ТЕМЫ ---
    const themes = [
        { 
            name: 'Synthwave Sunset', 
            minScore: 0, 
            bg: new THREE.Color(0x0f051d), 
            gridCenter: new THREE.Color(0xff007f), 
            gridSide: new THREE.Color(0x00fff5),
            light: new THREE.Color(0xffaa00)
        },
        { 
            name: 'Cyber Neon', 
            minScore: 300, 
            bg: new THREE.Color(0x000a1a), 
            gridCenter: new THREE.Color(0x00fff5), 
            gridSide: new THREE.Color(0x0055ff),
            light: new THREE.Color(0x00ffff)
        },
        { 
            name: 'Blood Red Grid', 
            minScore: 800, 
            bg: new THREE.Color(0x1a0005), 
            gridCenter: new THREE.Color(0xff0033), 
            gridSide: new THREE.Color(0xffaa00),
            light: new THREE.Color(0xff2200)
        },
        { 
            name: 'Matrix Emerald', 
            minScore: 1500, 
            bg: new THREE.Color(0x01140e), 
            gridCenter: new THREE.Color(0x00ff66), 
            gridSide: new THREE.Color(0x005522),
            light: new THREE.Color(0x00ff88)
        }
    ];

    // Игровые переменные
    const lanes = [-1.5, 0, 1.5];
    let currentLane = 1;
    let score = 0;

    const WIN_SCORE = 1000000;
    let isGameOver = false;
    let gameSpeed = 0.3;
    
    // Физика
    let isJumping = false;
    let jumpVelocity = 0;
    const gravity = -0.015;

    let isSliding = false;
    let slideTimer = 0;

    const obstacles = [];
    const coins = [];
    const particles = [];
    const sceneryObjects = [];

    // --- ДОРОГА И СЕТКА ---
    const roadGeo = new THREE.PlaneGeometry(5.2, 100);
    const roadMat = new THREE.MeshBasicMaterial({ color: 0x050010 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -40;
    scene.add(road);

    const gridHelper = new THREE.GridHelper(100, 40, 0x00fff5, 0x00fff5);
    gridHelper.position.set(0, 0.01, -40);
    gridHelper.scale.set(0.052, 1, 1);
    scene.add(gridHelper);

    const sideGrid = new THREE.GridHelper(200, 60, 0xff007f, 0xff007f);
    sideGrid.position.set(0, -0.01, -40);
    scene.add(sideGrid);

    // --- TRON LIGHT CYCLE ---
    function createTronBike() {
        const bikeGroup = new THREE.Group();

        const blackMat = new THREE.MeshStandardMaterial({ 
            color: 0x0a0a0d, 
            roughness: 0.1, 
            metalness: 0.9 
        });
        const glowOrangeMat = new THREE.MeshBasicMaterial({ color: 0xff5500 });
        const glowWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        function createHublessWheel() {
            const wheelGroup = new THREE.Group();
            const ringGeo = new THREE.TorusGeometry(0.38, 0.07, 16, 32);
            const ring = new THREE.Mesh(ringGeo, blackMat);
            wheelGroup.add(ring);

            const innerGlowGeo = new THREE.TorusGeometry(0.33, 0.02, 12, 32);
            const innerGlow = new THREE.Mesh(innerGlowGeo, glowOrangeMat);
            wheelGroup.add(innerGlow);

            return wheelGroup;
        }

        const frontWheel = createHublessWheel();
        frontWheel.rotation.y = Math.PI / 2;
        frontWheel.position.set(0, 0.38, -0.65);
        bikeGroup.add(frontWheel);

        const rearWheel = createHublessWheel();
        rearWheel.rotation.y = Math.PI / 2;
        rearWheel.position.set(0, 0.38, 0.65);
        bikeGroup.add(rearWheel);

        const bodyGeo = new THREE.BoxGeometry(0.5, 0.38, 1.2);
        const body = new THREE.Mesh(bodyGeo, blackMat);
        body.position.set(0, 0.38, 0);
        bikeGroup.add(body);

        const noseGeo = new THREE.CylinderGeometry(0.24, 0.25, 0.4, 16);
        const nose = new THREE.Mesh(noseGeo, blackMat);
        nose.rotation.z = Math.PI / 2;
        nose.position.set(0, 0.36, -0.45);
        bikeGroup.add(nose);

        const lineGeo = new THREE.BoxGeometry(0.52, 0.03, 0.9);
        const sideLine = new THREE.Mesh(lineGeo, glowOrangeMat);
        sideLine.position.set(0, 0.38, 0.05);
        bikeGroup.add(sideLine);

        const headlightGeo = new THREE.BoxGeometry(0.3, 0.1, 0.05);
        const headlight = new THREE.Mesh(headlightGeo, glowWhiteMat);
        headlight.position.set(0, 0.38, -0.68);
        bikeGroup.add(headlight);

        return bikeGroup;
    }

    const player = createTronBike();
    player.position.set(lanes[currentLane], 0, 0);
    scene.add(player);

    function updateTheme() {
        let currentTheme = themes[0];
        for (let i = themes.length - 1; i >= 0; i--) {
            if (score >= themes[i].minScore) {
                currentTheme = themes[i];
                break;
            }
        }

        document.getElementById('theme-indicator').innerText = 'Локация: ' + currentTheme.name;

        scene.background.lerp(currentTheme.bg, 0.05);
        scene.fog.color.lerp(currentTheme.bg, 0.05);
        dirLight.color.lerp(currentTheme.light, 0.05);

        gridHelper.material.color.lerp(currentTheme.gridCenter, 0.05);
        sideGrid.material.color.lerp(currentTheme.gridSide, 0.05);
    }

    // --- ГЕНЕРАЦИЯ ДЕКОРАЦИЙ ---
    function spawnMountain(side) {
        const height = Math.random() * 4 + 3;
        const geo = new THREE.ConeGeometry(Math.random() * 4 + 3, height, 4);
        const mat = new THREE.MeshStandardMaterial({ 
            color: 0x0a0015, 
            wireframe: true, 
            emissive: 0x440088 
        });
        const mountain = new THREE.Mesh(geo, mat);

        const x = side === 'left' ? -(Math.random() * 12 + 8) : (Math.random() * 12 + 8);
        mountain.position.set(x, height / 2, -90);
        scene.add(mountain);
        sceneryObjects.push(mountain);
    }

    function spawnFlatPalm(side) {
        const palmGeo = new THREE.PlaneGeometry(4, 8);
        const palmMat = new THREE.MeshBasicMaterial({
            map: palmTexture,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide
        });
        const palm = new THREE.Mesh(palmGeo, palmMat);

        const x = side === 'left' ? -(Math.random() * 3 + 4) : (Math.random() * 3 + 4);
        palm.position.set(x, 3.8, -90);
        scene.add(palm);
        sceneryObjects.push(palm);
    }

    // --- ПРЕПЯТСТВИЯ ---
    function createObstacle(x, y, height, color, tag) {
        const geo = new THREE.BoxGeometry(0.8, height, 0.8);
        const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 });
        const obs = new THREE.Mesh(geo, mat);
        obs.position.set(x, y, -50);
        obs.userData = { height: height, tag: tag };
        scene.add(obs);
        obstacles.push(obs);
    }

    function spawnCoin() {
        const coinGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.08, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, metalness: 0.9, roughness: 0.1 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        
        const lane = lanes[Math.floor(Math.random() * 3)];
        coin.rotation.x = Math.PI / 2;
        
        const coinY = Math.random() > 0.5 ? 2.2 : 0.5;
        coin.position.set(lane, coinY, -50);
        
        scene.add(coin);
        coins.push(coin);
    }

    function spawnPattern() {
        if (isGameOver) return;

        const type = Math.random();

        if (type < 0.35) {
            // Синее верхнее препятствие (теперь опущено ниже: y=1.2, height=1.5, просвет ровно под пригибание)
            createObstacle(lanes[Math.floor(Math.random() * 3)], 1.2, 1.5, 0x0088ff, 'overhead');
        } 
        else if (type < 0.60) {
            // Высокое препятствие (нужно обьехать)
            createObstacle(lanes[Math.floor(Math.random() * 3)], 1.2, 2.4, 0xff0055, 'high');
        } 
        else if (type < 0.80) {
            // Низкое препятствие на все 3 полосы (перепрыгнуть)
            for (let i = 0; i < 3; i++) {
                createObstacle(lanes[i], 0.4, 0.8, 0xff9900, 'low');
            }
        } 
        else {
            // Низкое одиночное
            createObstacle(lanes[Math.floor(Math.random() * 3)], 0.4, 0.8, 0xff4d4d, 'low');
        }

        if (Math.random() > 0.4) spawnFlatPalm('left');
        else spawnMountain('left');

        if (Math.random() > 0.4) spawnFlatPalm('right');
        else spawnMountain('right');

        if (Math.random() < 0.6) spawnCoin();
    }

    function createCoinParticles(x, y, z) {
        const pGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
        const pMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });

        for (let i = 0; i < 15; i++) {
            const p = new THREE.Mesh(pGeo, pMat);
            p.position.set(x, y, z);
            p.userData = {
                vx: (Math.random() - 0.5) * 0.2,
                vy: (Math.random() - 0.5) * 0.2 + 0.1,
                vz: (Math.random() - 0.5) * 0.2,
                life: 20
            };
            scene.add(p);
            particles.push(p);
        }
    }

    setInterval(spawnPattern, 1000);

    // Управление
    window.addEventListener('keydown', (e) => {
        initAudio();
        if (isGameOver) return;

        if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'А') && currentLane > 0) {
            currentLane--;
        } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'В') && currentLane < 2) {
            currentLane++;
        } else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && !isJumping && !isSliding) {
            isJumping = true;
            jumpVelocity = 0.28;
            playSound('jump');
        } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'Shift') && !isSliding && !isJumping) {
            isSliding = true;
            slideTimer = 25;
            player.scale.set(1.0, 0.2, 1.0); // Пригибание байка
            playSound('slide');
        }
    });

    // Игровой цикл
    function animate() {
        if (isGameOver) return;

        requestAnimationFrame(animate);

        updateTheme();

        gridHelper.position.z += gameSpeed;
        if (gridHelper.position.z > -30) gridHelper.position.z = -40;

        sideGrid.position.z += gameSpeed;
        if (sideGrid.position.z > -30) sideGrid.position.z = -40;

        player.position.x += (lanes[currentLane] - player.position.x) * 0.2;

        if (isJumping) {
            player.position.y += jumpVelocity;
            jumpVelocity += gravity;

            if (player.position.y <= 0) {
                player.position.y = 0;
                isJumping = false;
            }
        }

        if (isSliding) {
            slideTimer--;
            if (slideTimer <= 0) {
                isSliding = false;
                player.scale.set(1.0, 1.0, 1.0);
            }
        }

        // Декорации
        for (let i = sceneryObjects.length - 1; i >= 0; i--) {
            const obj = sceneryObjects[i];
            obj.position.z += gameSpeed;
            if (obj.position.z > 10) {
                scene.remove(obj);
                sceneryObjects.splice(i, 1);
            }
        }

        // Препятствия
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.position.z += gameSpeed;

            const distZ = Math.abs(obs.position.z - player.position.z);
            const distX = Math.abs(obs.position.x - player.position.x);

            if (distZ < 0.5 && distX < 0.5) {
                let collision = false;
                
                // Верхняя граница высоты мотоцикла
                const playerHeight = isSliding ? 0.2 : 0.7;
                const pTop = player.position.y + playerHeight;
                const pBottom = player.position.y;

                const oTop = obs.position.y + (obs.userData.height / 2);
                const oBottom = obs.position.y - (obs.userData.height / 2);

                if (pBottom < oTop && pTop > oBottom) {
                    collision = true;
                }

                if (collision) {
                    isGameOver = true;
                    playSound('gameover');
                    saveScore(score);
                    location.reload();
                }
            }

            if (obs.position.z > 5) {
                scene.remove(obs);
                obstacles.splice(i, 1);
            }
        }

        // Монеты
        for (let i = coins.length - 1; i >= 0; i--) {
            const coin = coins[i];
            coin.position.z += gameSpeed;
            coin.rotation.z += 0.05;

            const distZ = Math.abs(coin.position.z - player.position.z);
            const distX = Math.abs(coin.position.x - player.position.x);
            const distY = Math.abs(coin.position.y - (player.position.y + 0.3));

            if (distZ < 0.6 && distX < 0.6 && distY < 0.8) {
                score += 25;
                playSound('coin');
                createCoinParticles(coin.position.x, coin.position.y, coin.position.z);
                scene.remove(coin);
                coins.splice(i, 1);
                continue;
            }

            if (coin.position.z > 5) {
                scene.remove(coin);
                coins.splice(i, 1);
            }
        }

        // Частицы
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.position.x += p.userData.vx;
            p.position.y += p.userData.vy;
            p.position.z += p.userData.vz;
            p.userData.life--;

            if (p.userData.life <= 0) {
                scene.remove(p);
                particles.splice(i, 1);
            }
        }

        score += 0.1;
        gameSpeed += 0.00008;
        document.getElementById('score').innerText = Math.floor(score);

        if (score >= WIN_SCORE) {
            isGameOver = true;
            alert('НЕВЕРОЯТНО! ВЫ НАБРАЛИ 1 000 000 ОЧКОВ И ПОБЕДИЛИ!');
            saveScore(score);
            location.reload();
        }

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
