<div id="game-container">
    <div id="ui">
        Очки: <span id="score">0</span>
        <div id="theme-indicator">Локация: Synthwave Sunset</div>
        <div id="goal">Цель: 1 000 000</div>
    </div>

    <div id="leaderboard-box">
        <h3>ТОП 10 РЕКОРДОВ</h3>
        <ol id="leaderboard-list"></ol>
    </div>
</div>

<style>
    #game-container {
        width: 100%;
        height: 500px;
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        background: #0f051d;
    }

    #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #ff007f;
        font-size: 18px;
        font-weight: bold;
        text-shadow: 0 0 10px #ff007f, 0 0 20px #00fff5;
        z-index: 10;
    }

    #theme-indicator {
        font-size: 14px;
        color: #00fff5;
        margin-top: 5px;
        text-shadow: 0 0 5px #00fff5;
    }

    #goal {
        font-size: 12px;
        color: #ffd700;
        text-shadow: 0 0 5px #ffd700;
    }

    #leaderboard-box {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(10, 0, 20, 0.75);
        color: #00fff5;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ff007f;
        box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        max-width: 180px;
        font-size: 12px;
    }

    #leaderboard-box h3 {
        margin: 0 0 8px 0;
        color: #ff007f;
        font-size: 14px;
        text-align: center;
        text-shadow: 0 0 5px #ff007f;
    }

    #leaderboard-list {
        padding-left: 15px;
        margin: 0;
    }

    #leaderboard-list li {
        margin-bottom: 3px;
    }
</style>

<!-- Подключаем Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
    let scene, camera, renderer;
    let player, obstacles = [], coins = [], particles = [], sceneryObjects = [];
    let score = 0;
    let isGameOver = false;
    let isJumping = false, isSliding = false;
    let jumpVelocity = 0, slideTimer = 0;
    let currentLane = 1;
    let gameSpeed = 0.3;
    let audioCtx = null;
    let isMusicPlaying = false;
    let isInitializing = false;

    // --- ИНИЦИАЛИЗАЦИЯ ИГРЫ ---
    function initGame() {
        if (isInitializing) return;
        isInitializing = true;

        // Создаём сцену
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f051d);
        scene.fog = new THREE.FogExp2(0x0f051d, 0.012);

        // Камера
        const container = document.getElementById('game-container');
        camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 3.5, 6);
        camera.lookAt(0, 1, 0);

        // Рендерер
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Свет
        const dirLight = new THREE.DirectionalLight(0xffaa00, 1.2);
        dirLight.position.set(0, 10, -20);
        scene.add(dirLight);

        const ambientLight = new THREE.AmbientLight(0x400055, 0.8);
        scene.add(ambientLight);

        // Дорога и сетка
        const roadGeo = new THREE.PlaneGeometry(5.2, 100);
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x050010 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -40;
        scene.add(road);

        const gridHelper = new THREE.GridHelper(100, 40, 0x00fff5, 0x00fff5);
        gridHelper.position.set(0, 0.01, -40);
        gridHelper.scale.set(0.052, 1, 1);
        scene.add(gridHelper);

        const sideGrid = new THREE.GridHelper(200, 60, 0xff007f, 0xff007f);
        sideGrid.position.set(0, -0.01, -40);
        scene.add(sideGrid);

        // Игрок (Tron Bike)
        player = createTronBike();
        player.position.set(-1.5 * currentLane, 0, 0); // Начинаем с центральной полосы
        scene.add(player);

        // Звёздное небо
        createStarField();

        // Сynthwave Солнце
        createSun();

        // Запускаем игровой цикл
        animate();

        // Загружаем таблицу рекордов
        updateLeaderboardUI();

        // Обработчик ресайза
        window.addEventListener('resize', onWindowResize);

        isInitializing = false;
    }

    // --- СОЗДАНИЕ ОБЪЕКТОВ ---
    function createTronBike() {
        const bikeGroup = new THREE.Group();
        const blackMat = new THREE.MeshStandardMaterial({
            color: 0x0a0a0d,
            roughness: 0.1,
            metalness: 0.9
        });
        const glowOrangeMat = new THREE.MeshBasicMaterial({ color: 0xff5500 });

        const bodyGeo = new THREE.BoxGeometry(0.5, 0.38, 1.2);
        const body = new THREE.Mesh(bodyGeo, blackMat);
        body.position.set(0, 0.38, 0);
        bikeGroup.add(body);

        const lineGeo = new THREE.BoxGeometry(0.52, 0.03, 0.9);
        const sideLine = new THREE.Mesh(lineGeo, glowOrangeMat);
        sideLine.position.set(0, 0.38, 0.05);
        bikeGroup.add(sideLine);

        return bikeGroup;
    }

    function createSun() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const gradient = ctx.createLinearGradient(0, 0, 0, 512);
        gradient.addColorStop(0, '#ffcc00');
        gradient.addColorStop(0.5, '#ff007f');
        gradient.addColorStop(1, '#aa00ff');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(256, 256, 240, 0, Math.PI * 2);
        ctx.fill();

        const sunGeo = new THREE.PlaneGeometry(35, 35);
        const sunMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(canvas),
            transparent: true,
            depthWrite: false
        });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(0, 10, -90);
        scene.add(sun);
    }

    function createStarField() {
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 400;
        const starPositions = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 200;
            starPositions[i + 1] = Math.random() * 50 + 5;
            starPositions[i + 2] = -Math.random() * 100 - 20;
        }

        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);
    }

    // --- ГЕНЕРАЦИЯ ПРЕПЯТСТВИЙ ---
    function spawnPattern() {
        if (isGameOver) return;

        const type = Math.random();
        const lanes = [-1.5, 0, 1.5];

        if (type < 0.35) {
            // Верхнее препятствие (нужно пригибаться)
            createObstacle(lanes[Math.floor(Math.random() * 3)], 1.2, 1.5, 0x0088ff, 'overhead');
        }
        else if (type < 0.60) {
            // Высокое препятствие (нужно объезжать)
            createObstacle(lanes[Math.floor(Math.random() * 3)], 1.2, 2.4, 0xff0055, 'high');
        }
        else if (type < 0.80) {
            // Низкое препятствие на всех полосах (нужно перепрыгивать)
            for (let i = 0; i < 3; i++) {
                createObstacle(lanes[i], 0.4, 0.8, 0xff9900, 'low');
            }
        }
        else {
            // Низкое одиночное препятствие
            createObstacle(lanes[Math.floor(Math.random() * 3)], 0.4, 0.8, 0xff4d4d, 'low');
        }

        // Декорации
        if (Math.random() > 0.5) spawnFlatPalm('left');
        if (Math.random() > 0.5) spawnFlatPalm('right');

        if (Math.random() > 0.7) spawnCoin();
    }

    function createObstacle(x, y, height, color, tag) {
        const geo = new THREE.BoxGeometry(0.8, height, 0.8);
        const mat = new THREE.MeshStandardMaterial({ color: color });
        const obs = new THREE.Mesh(geo, mat);
        obs.position.set(x, y, -50);
        obs.userData = { height: height, tag: tag };
        scene.add(obs);
        obstacles.push(obs);
    }

    function spawnCoin() {
        const coinGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.08, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, metalness: 0.9 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        const lanes = [-1.5, 0, 1.5];
        coin.rotation.x = Math.PI / 2;
        coin.position.set(lanes[Math.floor(Math.random() * 3)], 0.5, -50);
        scene.add(coin);
        coins.push(coin);
    }

    function spawnFlatPalm(side) {
        const palmGeo = new THREE.PlaneGeometry(4, 8);
        const palmMat = new THREE.MeshBasicMaterial({ color: 0x00fff5 });
        const palm = new THREE.Mesh(palmGeo, palmMat);
        const x = side === 'left' ? -(Math.random() * 3 + 4) : (Math.random() * 3 + 4);
        palm.position.set(x, 3.8, -90);
        scene.add(palm);
        sceneryObjects.push(palm);
    }

    // --- УПРАВЛЕНИЕ ---
    function setupControls() {
        document.addEventListener('keydown', (e) => {
            if (isGameOver) {
                if (e.key === 'Enter' || e.key === ' ') {
                    resetGame();
                }
                return;
            }

            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'А') && currentLane > 0) {
                currentLane--;
                playSound('slide');
            }
            else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'В') && currentLane < 2) {
                currentLane++;
                playSound('slide');
            }
            else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && !isJumping && !isSliding) {
                isJumping = true;
                jumpVelocity = 0.28;
                playSound('jump');
            }
            else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'Shift') && !isSliding && !isJumping) {
                isSliding = true;
                slideTimer = 25;
                player.scale.set(1.0, 0.2, 1.0);
                playSound('slide');
            }
        });
    }

    // --- ЗВУК ---
    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
    }

    function playSound(type) {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        switch (type) {
            case 'jump':
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                break;
            case 'slide':
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                break;
            case 'coin':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(1200, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                break;
            case 'gameover':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                break;
        }

        osc.start(now);
        osc.stop(now + 0.5);
    }

    // --- ТАБЛИЦА РЕКОРДОВ ---
    function updateLeaderboardUI() {
        const listEl = document.getElementById('leaderboard-list');
        listEl.innerHTML = '';
        const scores = getLeaderboard();

        scores.forEach(item => {
            const li = document.createElement('li');
            li.innerText = `${item.name}: ${item.score}`;
            listEl.appendChild(li);
        });

        if (scores.length === 0) {
            listEl.innerHTML = '<li>Пока нет рекордов</li>';
        }
    }

    function getLeaderboard() {
        try {
            const stored = localStorage.getItem('synthwaveRiderLeaderboard');
            return stored ? JSON.parse(stored) : [];
        } catch (e) {
            return [];
        }
    }

    function saveScore(newScore) {
        let scores = getLeaderboard();
        const finalScore = Math.floor(newScore);

        if (scores.length < 10 || finalScore > (scores[scores.length - 1]?.score || 0)) {
            const name = prompt('Поздравляем! Вы вошли в ТОП-10! Введите ваше имя:', 'Игрок') || 'Аноним';
            scores.push({ name: name.substring(0, 10), score: finalScore });
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 10);
            localStorage.setItem('synthwaveRiderLeaderboard', JSON.stringify(scores));
            updateLeaderboardUI();
        }
    }

    // --- ИГРОВОЙ ЦИКЛ ---
    function animate() {
        if (isGameOver) return;

        requestAnimationFrame(animate);

        // Движение дороги и сетки
        for (const obj of [gridHelper, sideGrid]) {
            obj.position.z += gameSpeed;
            if (obj.position.z > -30) obj.position.z = -40;
        }

        // Движение игрока по полосам
        player.position.x += (lanes[currentLane] - player.position.x) * 0.2;

        // Прыжок
        if (isJumping) {
            player.position.y += jumpVelocity;
            jumpVelocity += gravity;

            if (player.position.y <= 0) {
                player.position.y = 0;
                isJumping = false;
            }
        }

        // Скольжение
        if (isSliding) {
            slideTimer--;
            if (slideTimer <= 0) {
                isSliding = false;
                player.scale.set(1.0, 1.0, 1.0);
            }
        }

        // Движение декораций
        sceneryObjects.forEach((obj, i) => {
            obj.position.z += gameSpeed;
            if (obj.position.z > 10) {
                scene.remove(obj);
                sceneryObjects.splice(i, 1);
            }
        });

        // Движение препятствий и проверка столкновений
        obstacles.forEach((obs, i) => {
            obs.position.z += gameSpeed;

            const distZ = Math.abs(obs.position.z - player.position.z);
            const distX = Math.abs(obs.position.x - player.position.x);

            if (distZ < 0.5 && distX < 0.5) {
                const playerHeight = isSliding ? 0.2 : 0.7;
                const pTop = player.position.y + playerHeight;
                const pBottom = player.position.y;
                const oTop = obs.position.y + (obs.userData.height / 2);
                const oBottom = obs.position.y - (obs.userData.height / 2);

                if (pBottom < oTop && pTop > oBottom) {
                    gameOver();
                }
            }

            if (obs.position.z > 5) {
                scene.remove(obs);
                obstacles.splice(i, 1);
            }
        });

        // Движение монет и сбор
        coins.forEach((coin, i) => {
            coin.position.z += gameSpeed;
            coin.rotation.z += 0.05;

            const distZ = Math.abs(coin.position.z - player.position.z);
            const distX = Math.abs(coin.position.x - player.position.x);
            const distY = Math.abs(coin.position.y - (player.position.y + 0.3));

            if (distZ < 0.6 && distX < 0.6 && distY < 0.8) {
                score += 25;
                playSound('coin');
                scene.remove(coin);
                coins.splice(i, 1);
            }

            if (coin.position.z > 5) {
                scene.remove(coin);
                coins.splice(i, 1);
            }
        });

        // Увеличение сложности
        score += 0.1;
        gameSpeed = 0.3 + Math.min(0.15, score / 1000);
        document.getElementById('score').innerText = Math.floor(score);

        renderer.render(scene, camera);
    }

    // --- КОНЕЦ ИГРЫ ---
    function gameOver() {
        isGameOver = true;
        playSound('gameover');
        saveScore(score);
        setTimeout(() => {
            alert(`Игра окончена! Ваш результат: ${Math.floor(score)} очков.`);
            resetGame();
        }, 500);
    }

    // --- СБРОС ИГРЫ ---
    function resetGame() {
        isGameOver = false;
        score = 0;
        gameSpeed = 0.3;
        currentLane = 1;
        isJumping = false;
        isSliding = false;
        jumpVelocity = 0;
        player.position.set(0, 0, 0);
        player.scale.set(1, 1, 1);

        // Очищаем все объекты
        obstacles.forEach(obs => scene.remove(obs));
        coins.forEach(coin => scene.remove(coin));
        sceneryObjects.forEach(obj => scene.remove(obj));
        obstacles = [];
        coins = [];
        sceneryObjects = [];

        document.getElementById('score').innerText = '0';
        animate();
    }

    // --- ОБРАБОТЧИК РЕСАЙЗА ---
    function onWindowResize() {
        const container = document.getElementById('game-container');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // --- ЗАПУСК ИГРЫ ---
    const lanes = [-1.5, 0, 1.5];
    setupControls();
    initGame();
</script>
