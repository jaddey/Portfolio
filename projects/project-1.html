<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --project-bg: #0a0f14;
            --project-accent: #2dd4bf;
            --particle-color: rgba(45, 212, 191, 0.6);
        }

        .project-content {
            background: var(--project-bg);
            color: #fff;
            padding: 2rem;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .project-inner {
            position: relative;
            z-index: 1;
            max-width: 800px;
            width: 100%;
        }

        .project-inner h3 {
            font-size: 2rem;
            color: var(--project-accent);
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(45, 212, 191, 0.3);
        }

        .project-inner p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #a0aec0;
            margin-bottom: 2rem;
        }

        .project-inner img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid rgba(45, 212, 191, 0.3);
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.2);
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }

        .project-inner img:hover {
            transform: scale(1.02);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-inner h3 {
            animation: fadeIn 0.6s ease-out;
        }

        .project-inner p {
            animation: fadeIn 0.8s ease-out;
        }

        .project-inner img {
            animation: fadeIn 1s ease-out;
        }
    </style>
</head>
<body>
    <div class="project-content">
        <div class="project-inner">
            <h3>Pickle Peter</h3>
            <p>
                Прототип моей первой игры про огурчика Питера, который летает в космосе,
                собирая укроп для рассола и уворачиваясь от космических пираний.
                <br><br>
                К сожалению, сохранился только билд APK на моём старом телефоне.
            </p>
            <img src="Media/Pickle_Peter.gif" alt="Pickle Peter - скриншот игры">
        </div>
    </div>
</body>
</html>
