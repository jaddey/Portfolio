<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .card-photo {
            max-width: 250px;
            margin: 0 auto;
        }
        .floating-collapse-btn {
            bottom: 1.5rem;
            right: 1.5rem;
        }
    </style>
</head>
<body>

    <!-- Прогресс скролла -->
    <div class="scroll-progress-container">
        <div class="scroll-progress-bar" id="progressBar"></div>
    </div>

    <!-- Панель навигации -->
    <nav class="nav-bar">
        <div class="nav-header">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span class="nav-label">Навигация</span>
        </div>
        <div class="nav-links">
            <button class="nav-btn" onclick="scrollToCard('card-about')">О себе</button>
            <button class="nav-btn" onclick="scrollToCard('card-career')">Карьера</button>
            <button class="nav-btn" onclick="scrollToCard('card-projects')">Мои работы</button>
            <button class="nav-btn" onclick="scrollToCard('card-contacts')">Контакты</button>
        </div>
    </nav>

    <!-- SVG Градиенты и Фигуры -->
    <svg style="width:0; height:0; position:absolute;" aria-hidden="true">
        <defs>
            <linearGradient id="gamepad-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--accent-primary)" stop-opacity="0.9" />
                <stop offset="100%" stop-color="var(--accent-primary)" stop-opacity="0.1" />
            </linearGradient>
            <linearGradient id="gamepad-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="var(--accent-primary)" stop-opacity="0.8" />
                <stop offset="100%" stop-color="var(--accent-primary)" stop-opacity="0.2" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Декоративный фон -->
    <div class="bg-dots"></div>
    <div class="bg-shape shape-square square-1"></div>
    <div class="bg-shape shape-square square-2"></div>

    <svg class="bg-shape shape-gamepad gamepad-1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path d="M362.7 128H149.3C102.5 128 64 166.5 64 213.3v132.3c0 23 15.6 42.6 38.2 47.1l42.7 8.5c18.5 3.7 36.3-8.8 39.5-27.4l11.2-64.8c1.8-10.4 10.8-18 21.4-18h78.1c10.5 0 19.6 7.6 21.4 18l11.2 64.8c3.2 18.6 21 31.1 39.5 27.4l42.7-8.5c22.6-4.5 38.2-24.1 38.2-47.1V213.3c0-46.8-38.5-85.3-85.3-85.3zM170.7 245.3h-21.3v21.3c0 5.9-4.8 10.7-10.7 10.7s-10.7-4.8-10.7-10.7v-21.3h-21.3c-5.9 0-10.7-4.8-10.7-10.7s4.8-10.7 10.7-10.7h21.3v-21.3c0-5.9 4.8-10.7 10.7-10.7s10.7 4.8 10.7 10.7v21.3h21.3c5.9 0 10.7 4.8 10.7 10.7s-4.8 10.7-10.7 10.7zm170.7 21.3c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3zm42.7-42.7c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3z"/>
    </svg>

    <!-- Основной контент -->
    <main class="container">
        <!-- Шапка с именем -->
        <header class="header">
            <h1 id="user-name"></h1>
            <p id="user-role" class="subtitle"></p>
        </header>

        <!-- Карточка: О себе -->
        <section id="card-about" class="card">
            <div class="card-header">
                <h2 id="about-title">О себе</h2>
                <button class="collapse-toggle-btn" onclick="toggleCard('card-about')"></button>
            </div>
            <div class="card-body">
                <p id="about-text"></p>
            </div>
        </section>

        <!-- Карточка: Карьера -->
        <section id="card-career" class="card">
            <div class="card-header">
                <h2 id="career-title">Карьера</h2>
                <button class="collapse-toggle-btn" onclick="toggleCard('card-career')"></button>
            </div>
            <div class="card-body">
                <div id="career-list"></div>
            </div>
        </section>

        <!-- Карточка: Мои работы -->
        <section id="card-projects" class="card">
            <div class="card-header">
                <h2 id="projects-title">Мои работы</h2>
                <button class="collapse-toggle-btn" onclick="toggleCard('card-projects')"></button>
            </div>
            <div class="card-body">
                <div id="projects-list"></div>
            </div>
        </section>

        <!-- Карточка: Контакты -->
        <section id="card-contacts" class="card">
            <div class="card-header">
                <h2 id="contacts-title">Контакты</h2>
                <button class="collapse-toggle-btn" onclick="toggleCard('card-contacts')"></button>
            </div>
            <div class="card-body">
                <div id="contacts-text"></div>
            </div>
        </section>
    </main>

    <!-- Подключение JS файлов -->
    <script src="scripts/portfolio-loader.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
