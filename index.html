<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — Technical Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1b1e24;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* --- ФОНОВЫЕ ЭФФЕКТЫ --- */

        .bg-dots {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        /* Квадраты (#0e4b4e) */
        .shape-square {
            filter: blur(20px);
            opacity: 0.18;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(14, 75, 78, 0.9), rgba(14, 75, 78, 0.1));
        }

        .square-1 {
            width: 550px;
            height: 550px;
            top: -100px;
            left: -180px;
            transform: rotate(20deg);
        }

        .square-2 {
            width: 450px;
            height: 450px;
            bottom: -100px;
            right: -100px;
            transform: rotate(-15deg);
        }

        /* Геймпады (#106b6e) */
        .shape-gamepad {
            filter: blur(12px);
            opacity: 0.16;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 1.5;
        }

        .gamepad-1 {
            top: 20%;
            right: 5%;
            width: 480px;
            height: auto;
            fill: url(#gamepad-grad-1);
        }

        .gamepad-2 {
            bottom: 15%;
            left: -50px;
            width: 400px;
            height: auto;
            fill: url(#gamepad-grad-2);
        }

        /* --- СТРУКТУРА И СЕТКА --- */

        .grid-container {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            background-color: rgba(21, 23, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: rgba(16, 107, 110, 0.5);
            transform: translateY(-2px);
        }

        .card-photo {
            padding: 0;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-header {
            text-align: left;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #106b6e;
            font-weight: 600;
        }

        .card-full-width {
            grid-column: span 2;
            text-align: left;
        }

        h2 {
            font-size: 1.1rem;
            color: #106b6e;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .description {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
            white-space: pre-line;
        }

        /* Стили для кликабельных ссылок в контактах */
        .description a {
            color: #106b6e;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .description a:hover {
            color: #148f93;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .card-full-width {
                grid-column: span 1;
            }

            .card-photo {
                max-width: 250px;
                margin: 0 auto;
            }

            .gamepad-1 {
                width: 320px;
                right: -60px;
            }

            .gamepad-2 {
                width: 280px;
                left: -60px;
            }
        }
    </style>
</head>
<body>

    <!-- SVG-градиенты для геймпадов -->
    <svg style="width:0; height:0; position:absolute;" aria-hidden="true">
        <defs>
            <linearGradient id="gamepad-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#106b6e" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#106b6e" stop-opacity="0.1" />
            </linearGradient>
            <linearGradient id="gamepad-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#106b6e" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#106b6e" stop-opacity="0.2" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Точечный узор -->
    <div class="bg-dots"></div>

    <!-- Квадраты -->
    <div class="bg-shape shape-square square-1"></div>
    <div class="bg-shape shape-square square-2"></div>

    <!-- Геймпады -->
    <svg class="bg-shape shape-gamepad gamepad-1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path d="M362.7 128H149.3C102.5 128 64 166.5 64 213.3v132.3c0 23 15.6 42.6 38.2 47.1l42.7 8.5c18.5 3.7 36.3-8.8 39.5-27.4l11.2-64.8c1.8-10.4 10.8-18 21.4-18h78.1c10.5 0 19.6 7.6 21.4 18l11.2 64.8c3.2 18.6 21 31.1 39.5 27.4l42.7-8.5c22.6-4.5 38.2-24.1 38.2-47.1V213.3c0-46.8-38.5-85.3-85.3-85.3zM170.7 245.3h-21.3v21.3c0 5.9-4.8 10.7-10.7 10.7s-10.7-4.8-10.7-10.7v-21.3h-21.3c-5.9 0-10.7-4.8-10.7-10.7s4.8-10.7 10.7-10.7h21.3v-21.3c0-5.9 4.8-10.7 10.7-10.7s10.7 4.8 10.7 10.7v21.3h21.3c5.9 0 10.7 4.8 10.7 10.7s-4.8 10.7-10.7 10.7zm170.7 21.3c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3zm42.7-42.7c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3z"/>
    </svg>

    <svg class="bg-shape shape-gamepad gamepad-2" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path d="M362.7 128H149.3C102.5 128 64 166.5 64 213.3v132.3c0 23 15.6 42.6 38.2 47.1l42.7 8.5c18.5 3.7 36.3-8.8 39.5-27.4l11.2-64.8c1.8-10.4 10.8-18 21.4-18h78.1c10.5 0 19.6 7.6 21.4 18l11.2 64.8c3.2 18.6 21 31.1 39.5 27.4l42.7-8.5c22.6-4.5 38.2-24.1 38.2-47.1V213.3c0-46.8-38.5-85.3-85.3-85.3zM170.7 245.3h-21.3v21.3c0 5.9-4.8 10.7-10.7 10.7s-10.7-4.8-10.7-10.7v-21.3h-21.3c-5.9 0-10.7-4.8-10.7-10.7s4.8-10.7 10.7-10.7h21.3v-21.3c0-5.9 4.8-10.7 10.7-10.7s10.7 4.8 10.7 10.7v21.3h21.3c5.9 0 10.7 4.8 10.7 10.7s-4.8 10.7-10.7 10.7zm170.7 21.3c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3zm42.7-42.7c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3z"/>
    </svg>

    <!-- СЕТКА КАРТОЧЕК -->
    <div class="grid-container">
        
        <!-- Фото -->
        <div class="card card-photo">
            <img src="photo.jpg" alt="Александер Масюк" class="profile-img">
        </div>

        <!-- Имя и Шапка -->
        <div class="card card-header">
            <h1 id="user-name">...</h1>
            <div class="subtitle" id="user-role">...</div>
        </div>

        <!-- О себе -->
        <div class="card card-full-width">
            <h2 id="about-title">...</h2>
            <div class="description" id="about-text"></div>
        </div>

        <!-- Опыт работы -->
        <div class="card card-full-width">
            <h2 id="experience-title">...</h2>
            <div class="description" id="experience-text"></div>
        </div>

        <!-- Контакты -->
        <div class="card card-full-width">
            <h2 id="contacts-title">...</h2>
            <div class="description" id="contacts-text"></div>
        </div>

    </div>

    <!-- Скрипт загрузки данных -->
    <script>
        fetch('profile.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-name').textContent = data.name;
                document.getElementById('user-role').textContent = data.role;
                
                document.getElementById('about-title').textContent = data.aboutTitle;
                document.getElementById('about-text').innerText = data.aboutText;
                
                document.getElementById('experience-title').textContent = data.experienceTitle;
                document.getElementById('experience-text').innerText = data.experienceText;
                
                document.getElementById('contacts-title').textContent = data.contactsTitle;
                // Использование innerHTML для рендеринга ссылок <a>:
                document.getElementById('contacts-text').innerHTML = data.contactsText;

                document.title = `${data.name} — ${data.role}`;
            })
            .catch(error => {
                console.error('Ошибка загрузки profile.json:', error);
            });

        // Эффект параллакса
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;

            const sq1 = document.querySelector('.square-1');
            const sq2 = document.querySelector('.square-2');
            const gp1 = document.querySelector('.gamepad-1');
            const gp2 = document.querySelector('.gamepad-2');

            if (sq1) sq1.style.transform = `translateY(${scrolled * 0.22}px) rotate(${20 + scrolled * 0.03}deg)`;
            if (sq2) sq2.style.transform = `translateY(${-scrolled * 0.18}px) rotate(${-15 - scrolled * 0.02}deg)`;
            if (gp1) gp1.style.transform = `translateY(${-scrolled * 0.15}px) rotate(${-12 + scrolled * 0.04}deg)`;
            if (gp2) gp2.style.transform = `translateY(${scrolled * 0.2}px) rotate(${25 - scrolled * 0.03}deg)`;
        });
    </script>

</body>
</html>
