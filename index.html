<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — Technical Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1b1e24;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

/* --- ФОНОВЫЕ ЭФФЕКТЫ --- */
        
        /* 1. Точечный узор (Dot Pattern) вместо сетки */
        .bg-dots {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        /* 2. Плавные светящиеся пятна (Glow Orbs) */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
            animation: pulse 8s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #106b6e;
            top: -50px;
            left: -50px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #0e4b4e;
            bottom: -100px;
            right: -100px;
            animation-delay: -4s;
        }

        @keyframes pulse {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 0.2;
            }
            100% {
                transform: scale(1.2) translate(30px, -20px);
                opacity: 0.35;
            }
        }
        /* --- СТРУКТУРА И КАРТОЧКИ --- */
        
        .grid-container {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1; /* Чтобы карточки были над фоном */
        }

        /* Карточки с эффектом полупрозрачности (Glassmorphism) */
        .card {
            background-color: rgba(21, 23, 28, 0.85); /* Легкая прозрачность */
            backdrop-filter: blur(12px); /* Размытие фона за карточкой */
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        /* Легкий интерактив при наведении на карточки */
        .card:hover {
            border-color: rgba(16, 107, 110, 0.5);
            transform: translateY(-2px);
        }

        .card-photo {
            padding: 0;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-header {
            text-align: left;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #106b6e;
            font-weight: 600;
        }

        .card-full-width {
            grid-column: span 2;
            text-align: left;
        }

        h2 {
            font-size: 1.1rem;
            color: #106b6e;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .description {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
            white-space: pre-line;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .card-full-width {
                grid-column: span 1;
            }

            .card-photo {
                max-width: 250px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновые элементы -->
    <div class="bg-grid"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="grid-container">
        
        <div class="card card-photo">
            <img src="photo.jpg" alt="Александер Масюк" class="profile-img">
        </div>

        <div class="card card-header">
            <h1 id="user-name">...</h1>
            <div class="subtitle" id="user-role">...</div>
        </div>

        <div class="card card-full-width">
            <h2 id="about-title">...</h2>
            <div class="description" id="about-text"></div>
        </div>

        <div class="card card-full-width">
            <h2 id="experience-title">...</h2>
            <div class="description" id="experience-text"></div>
        </div>

    </div>

    <script>
        fetch('profile.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-name').textContent = data.name;
                document.getElementById('user-role').textContent = data.role;
                document.getElementById('about-title').textContent = data.aboutTitle;
                document.getElementById('about-text').textContent = data.aboutText;
                document.getElementById('experience-title').textContent = data.experienceTitle;
                document.getElementById('experience-text').textContent = data.experienceText;
                document.title = `${data.name} — ${data.role}`;
            })
            .catch(error => {
                console.error('Ошибка загрузки данных:', error);
            });
    </script>

</body>
</html>
