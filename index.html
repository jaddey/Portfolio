<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — Technical Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1b1e24;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Главная сетка */
        .grid-container {
            display: grid;
            grid-template-columns: 220px 1fr; /* Фиксированное фото 220px + остаток под имя */
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
        }

        /* Стиль карточек */
        .card {
            background-color: #15171c;
            border: 1px solid #2e333d;
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Фото (строго квадратное) */
        .card-photo {
            padding: 0;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Имя и Профессия (справа от фото) */
        .card-header {
            text-align: left;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #106b6e;
            font-weight: 600;
        }

        /* Широкие текстовые блоки (О себе, Опыт работы) */
        .card-full-width {
            grid-column: span 2; /* Растягиваем на всю ширину сетки */
            text-align: left;
        }

        h2 {
            font-size: 1.1rem;
            color: #106b6e;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .description {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
            white-space: pre-line;
        }

        /* Мобильная адаптивность */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .card-full-width {
                grid-column: span 1;
            }

            .card-photo {
                max-width: 250px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <div class="grid-container">
        
        <!-- Верхний ряд: Квадратное фото -->
        <div class="card card-photo">
            <img src="photo.jpg" alt="Александер Масюк" class="profile-img">
        </div>

        <!-- Верхний ряд: Имя и Профессия -->
        <div class="card card-header">
            <h1 id="user-name">...</h1>
            <div class="subtitle" id="user-role">...</div>
        </div>

        <!-- Нижний блок 1: О себе (широкий) -->
        <div class="card card-full-width">
            <h2 id="about-title">...</h2>
            <div class="description" id="about-text"></div>
        </div>

        <!-- Нижний блок 2: Опыт работы (широкий) -->
        <div class="card card-full-width">
            <h2 id="experience-title">...</h2>
            <div class="description" id="experience-text"></div>
        </div>

    </div>

    <!-- Скрипт подгрузки данных из profile.json -->
    <script>
        fetch('profile.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-name').textContent = data.name;
                document.getElementById('user-role').textContent = data.role;
                
                document.getElementById('about-title').textContent = data.aboutTitle;
                document.getElementById('about-text').textContent = data.aboutText;
                
                document.getElementById('experience-title').textContent = data.experienceTitle;
                document.getElementById('experience-text').textContent = data.experienceText;
                
                document.title = `${data.name} — ${data.role}`;
            })
            .catch(error => {
                console.error('Ошибка загрузки данных:', error);
            });
    </script>

</body>
</html>
