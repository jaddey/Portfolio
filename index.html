<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-primary: #58a6ff;
            --border-color: rgba(48, 54, 61, 0.8);
            --border-hover: rgba(88, 166, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Панель быстрой навигации */
        .nav-bar {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 90;
            background: var(--card-bg);
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            width: 140px;
            height: 42px;
            cursor: pointer;
        }

        .nav-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }

        .nav-bar:hover .nav-header {
            color: var(--accent-primary);
        }

        /* Раскрытие при наведении */
        .nav-bar:hover {
            width: 160px;
            height: auto;
            padding: 0.75rem;
            border-color: var(--border-hover);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-top: 0.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .nav-bar:hover .nav-links {
            opacity: 1;
            pointer-events: auto;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: right;
            width: 100%;
            white-space: nowrap;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .nav-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Контейнер карточек */
        .cards-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Общие стили карточки */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--accent-primary);
            margin-bottom: 1rem;
        }

        .card-content {
            color: var(--text-secondary);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Навигационная панель -->
    <nav class="nav-bar">
        <div class="nav-header">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span class="nav-label">Навигация</span>
        </div>
        <div class="nav-links">
            <button class="nav-btn" onclick="scrollToCard('card-about')">О себе</button>
            <button class="nav-btn" onclick="scrollToCard('card-experience')">Опыт</button>
            <button class="nav-btn" onclick="scrollToCard('card-contacts')">Контакты</button>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="cards-container">
        <section class="card" id="card-about">
            <h2 class="card-title">О себе</h2>
            <p class="card-content">
                Разрабатываю проекты, создаю инструменты и интерактивные приложения.
            </p>
        </section>

        <section class="card" id="card-experience">
            <h2 class="card-title">Опыт</h2>
            <p class="card-content">
                Описание опыта работы, проектов и стека технологий.
            </p>
        </section>

        <section class="card" id="card-contacts">
            <h2 class="card-title">Контакты</h2>
            <p class="card-content">
                Способы связи и ссылки на соцсети или профили.
            </p>
        </section>
    </div>

    <script>
        function scrollToCard(id) {
            const card = document.getElementById(id);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    </script>
</body>
</html>
