<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — Technical Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1b1e24;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* --- ФОНОВЫЕ ЭФФЕКТЫ --- */

        /* Точечный фоновый узор */
        .bg-dots {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        /* Чёткие геометрические фигуры с эффектом Параллакса */
        .bg-shape {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
            transition: transform 0.1s ease-out;
            filter: blur(25px); /* Уменьшили размытие, чтобы сделать фигуры четче */
            opacity: 0.35;
            border: 1px solid rgba(255, 255, 255, 0.15); /* Тонкий контур для акцента */
        }

        /* 1. Наклонный куб / ромб */
        .shape-1 {
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, #106b6e, rgba(16, 107, 110, 0.2));
            top: 5%;
            left: -80px;
            border-radius: 24px;
            transform: rotate(25deg);
        }

        /* 2. Капсула / плашка */
        .shape-2 {
            width: 400px;
            height: 200px;
            background: linear-gradient(135deg, #0e4b4e, #106b6e);
            top: 40%;
            right: -100px;
            border-radius: 100px;
            transform: rotate(-15deg);
        }

        /* 3. Маленький аккуратный ромб снизу */
        .shape-3 {
            width: 220px;
            height: 220px;
            background: linear-gradient(45deg, #106b6e, transparent);
            bottom: -40px;
            left: 15%;
            border-radius: 16px;
            transform: rotate(45deg);
        }

        /* --- СТРУКТУРА И СЕТКА --- */

        .grid-container {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Карточки с эффектом матового стекла */
        .card {
            background-color: rgba(21, 23, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: rgba(16, 107, 110, 0.5);
            transform: translateY(-2px);
        }

        /* Квадратное фото */
        .card-photo {
            padding: 0;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Имя и профессия */
        .card-header {
            text-align: left;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #106b6e;
            font-weight: 600;
        }

        /* Широкие блоки (О себе, Опыт работы) */
        .card-full-width {
            grid-column: span 2;
            text-align: left;
        }

        h2 {
            font-size: 1.1rem;
            color: #106b6e;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .description {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
            white-space: pre-line;
        }

        /* Адаптивность под мобильные устройства */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .card-full-width {
                grid-column: span 1;
            }

            .card-photo {
                max-width: 250px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновые элементы -->
    <div class="bg-dots"></div>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="grid-container">
        
        <!-- Фото (Квадратное) -->
        <div class="card card-photo">
            <img src="photo.jpg" alt="Александер Масюк" class="profile-img">
        </div>

        <!-- Имя и Профессия -->
        <div class="card card-header">
            <h1 id="user-name">...</h1>
            <div class="subtitle" id="user-role">...</div>
        </div>

        <!-- О себе -->
        <div class="card card-full-width">
            <h2 id="about-title">...</h2>
            <div class="description" id="about-text"></div>
        </div>

        <!-- Опыт работы -->
        <div class="card card-full-width">
            <h2 id="experience-title">...</h2>
            <div class="description" id="experience-text"></div>
        </div>

    </div>

    <!-- Скрипт загрузки данных и параллакс-эффекта -->
    <script>
        // 1. Подгрузка данных из profile.json
        fetch('profile.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-name').textContent = data.name;
                document.getElementById('user-role').textContent = data.role;
                
                document.getElementById('about-title').textContent = data.aboutTitle;
                document.getElementById('about-text').textContent = data.aboutText;
                
                document.getElementById('experience-title').textContent = data.experienceTitle;
                document.getElementById('experience-text').textContent = data.experienceText;
                
                document.title = `${data.name} — ${data.role}`;
            })
            .catch(error => {
                console.error('Ошибка загрузки профиля:', error);
            });

        // 2. Параллакс геометрических фигур с легким вращением при скролле
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;

            const shape1 = document.querySelector('.shape-1');
            const shape2 = document.querySelector('.shape-2');
            const shape3 = document.querySelector('.shape-3');

            if (shape1) {
                shape1.style.transform = `translateY(${scrolled * 0.3}px) rotate(${25 + scrolled * 0.05}deg)`;
            }
            if (shape2) {
                shape2.style.transform = `translateY(${-scrolled * 0.2}px) rotate(${-15 - scrolled * 0.03}deg)`;
            }
            if (shape3) {
                shape3.style.transform = `translate(${scrolled * 0.1}px, ${-scrolled * 0.15}px) rotate(${45 + scrolled * 0.08}deg)`;
            }
        });
    </script>

</body>
</html>
