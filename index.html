<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Александер Масюк — Technical Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1b1e24;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            text-align: center;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #106b6e;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.35rem;
            color: #106b6e;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        p.description {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 2rem auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Укажи точное имя своего файла с фото вместо photo.jpg -->
        <img src="photo.jpg" alt="Александер Масюк" class="profile-img">
        
        <h1>Привет! Меня зовут Александер Масюк</h1>
        <div class="subtitle">Technical Designer</div>
        
        <p class="description">
            Разрабатываю интерактивные презентации, визуальные механики и инструменты на Unity & C#.
        </p>
    </div>

</body>
</html>
