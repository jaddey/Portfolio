<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — Technical Designer</title>
    
    <link rel="stylesheet" href="theme.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-body);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 2rem 60vh 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Индикатор прокрутки */
        .scroll-progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            z-index: 1000;
        }

        .scroll-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--scroll-bar-color);
            box-shadow: 0 0 8px var(--scroll-bar-color);
            transition: width 0.1s ease-out;
        }

        /* Панель быстрой навигации */
        .nav-bar {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 90;
            background: var(--card-bg);
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            width: 140px;
            height: 42px;
            cursor: pointer;
        }

        .nav-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }

        .nav-bar:hover .nav-header {
            color: var(--accent-primary);
        }

        .nav-bar:hover {
            width: 170px;
            height: auto;
            padding: 0.75rem;
            border-color: var(--border-hover);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-top: 0.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .nav-bar:hover .nav-links {
            opacity: 1;
            pointer-events: auto;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: right;
            width: 100%;
            white-space: nowrap;
            transition: color 0.2s ease, background 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.4rem;
        }

        .nav-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-btn-highlight {
            color: var(--accent-primary);
            font-weight: 700;
        }

        .nav-btn-highlight:hover {
            color: var(--accent-hover);
        }

        /* Фоновые фигуры */
        .bg-dots {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--bg-dots-color) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        .shape-square {
            filter: blur(20px);
            opacity: 0.18;
            border: 1px solid var(--border-color);
            border-radius: 32px;
            background: linear-gradient(135deg, var(--accent-dark), transparent);
        }

        .square-1 {
            width: 550px;
            height: 550px;
            top: -100px;
            left: -180px;
            transform: rotate(20deg);
        }

        .square-2 {
            width: 450px;
            height: 450px;
            bottom: -100px;
            right: -100px;
            transform: rotate(-15deg);
        }

        .shape-gamepad {
            filter: blur(12px);
            opacity: 0.16;
            stroke: var(--border-color);
            stroke-width: 1.5;
        }

        .gamepad-1 {
            top: 20%;
            right: 5%;
            width: 480px;
            height: auto;
            fill: url(#gamepad-grad-1);
        }

        .gamepad-2 {
            bottom: 15%;
            left: -50px;
            width: 400px;
            height: auto;
            fill: url(#gamepad-grad-2);
        }

        /* Сетка карточек */
        .grid-container {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
            margin-top: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
            scroll-margin-top: 2rem;
        }

        .card:hover {
            border-color: var(--border-hover);
        }

        .card-photo {
            padding: 0;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-header {
            text-align: left;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--accent-primary);
            font-weight: 600;
        }

        .card-full-width {
            grid-column: span 2;
            text-align: left;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
            width: fit-content;
        }

        h2 {
            font-size: 1.1rem;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
        }

        .toggle-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--accent-primary);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .card-collapsible.collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        .description {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-height: 5000px;
            opacity: 1;
            overflow: hidden;
            margin-top: 0.75rem;
            white-space: pre-line;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
        }

        .submodules-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }

        .submodule-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .submodule-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .submodule-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .submodule-subtitle {
            font-size: 0.95rem;
            color: var(--accent-primary);
        }

        .submodule-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            white-space: nowrap;
        }

        .submodule-body {
            white-space: pre-line;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.25rem;
        }

        .tag {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* --- Сетка карточек проектов --- */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
            margin-top: 0.75rem;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .project-card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.05);
        }

        .project-card-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
        }

        .project-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .project-card-subtitle {
            font-size: 0.85rem;
            color: var(--accent-primary);
        }

        .project-card-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        /* --- Модальное окно (Pop-up) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            padding: 2rem;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 1.6rem;
            color: var(--text-primary);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .modal-subtitle {
            font-size: 1rem;
            color: var(--accent-primary);
            margin-bottom: 1rem;
        }

        .modal-gallery {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .modal-gallery img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            object-fit: cover;
        }

        .modal-description {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-line;
            margin-bottom: 1.5rem;
        }

        .modal-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent-primary);
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s ease;
        }

        .modal-link-btn:hover {
            background: var(--accent-hover);
        }

        .contacts-wrapper {
            font-style: normal;
            line-height: 1.8;
        }

        .contact-row {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
        }

        .contact-row a {
            color: var(--accent-primary);
            text-decoration: none;
            transition: color 0.2s ease, text-decoration 0.2s ease;
        }

        .contact-row a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .copy-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .copy-btn:hover {
            color: var(--accent-hover);
            background: rgba(255, 255, 255, 0.05);
        }

        .copy-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .copy-tooltip {
            position: absolute;
            right: -85px;
            background: var(--accent-primary);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .copy-tooltip.show {
            opacity: 1;
        }

        /* Кнопка скачивания PDF в контактах */
        .pdf-download-block {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .pdf-download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--accent-primary);
            color: #ffffff;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .pdf-download-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .pdf-download-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-collapsible.collapsed .description {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        .floating-collapse-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--accent-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.2s ease, background-color 0.2s ease;
        }

        .floating-collapse-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .floating-collapse-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .floating-collapse-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .card-full-width {
                grid-column: span 1;
            }

            .card-photo {
                max-width: 250px;
                margin: 0 auto;
            }

            .floating-collapse-btn {
                bottom: 1.5rem;
                right: 1.5rem;
            }

            .modal-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>

        <div class="scroll-progress-bar" id="progressBar"></div>

    </svg>

    <svg class="bg-shape shape-gamepad gamepad-2" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path d="M362.7 128H149.3C102.5 128 64 166.5 64 213.3v132.3c0 23 15.6 42.6 38.2 47.1l42.7 8.5c18.5 3.7 36.3-8.8 39.5-27.4l11.2-64.8c1.8-10.4 10.8-18 21.4-18h78.1c10.5 0 19.6 7.6 21.4 18l11.2 64.8c3.2 18.6 21 31.1 39.5 27.4l42.7-8.5c22.6-4.5 38.2-24.1 38.2-47.1V213.3c0-46.8-38.5-85.3-85.3-85.3zM170.7 245.3h-21.3v21.3c0 5.9-4.8 10.7-10.7 10.7s-10.7-4.8-10.7-10.7v-21.3h-21.3c-5.9 0-10.7-4.8-10.7-10.7s4.8-10.7 10.7-10.7h21.3v-21.3c0-5.9 4.8-10.7 10.7-10.7s10.7 4.8 10.7 10.7v21.3h21.3c5.9 0 10.7 4.8 10.7 10.7s-4.8 10.7-10.7 10.7zm170.7 21.3c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3zm42.7-42.7c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3z"/>
    </svg>

    <div class="grid-container">
        
        <div class="card card-photo">
            <img src="photo.jpg" alt="Александер Масюк" class="profile-img">
        </div>

        <div class="card card-header">
            <h1 id="user-name">...</h1>
            <div class="subtitle" id="user-role">...</div>
        </div>

        <div class="card card-full-width card-collapsible" id="card-about">
            <div class="card-title-row" onclick="toggleCard('card-about')">
                <h2 id="about-title">О себе</h2>
                <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"></polyline></svg>
            </div>
            <div class="description" id="about-text"></div>
        </div>

        <div class="card card-full-width card-collapsible" id="card-career">
            <div class="card-title-row" onclick="toggleCard('card-career')">
                <h2 id="career-title">Карьера</h2>
                <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"></polyline></svg>
            </div>
            <div class="description">
                <div class="submodules-list" id="career-list"></div>
            </div>
        </div>

        <!-- Секция: Мои работы -->
        <div class="card card-full-width card-collapsible" id="card-projects">
            <div class="card-title-row" onclick="toggleCard('card-projects')">
                <h2 id="projects-title">Мои работы</h2>
                <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"></polyline></svg>
            </div>
            <div class="description">
                <div class="projects-grid" id="projects-list"></div>
            </div>
        </div>

        <div class="card card-full-width card-collapsible" id="card-contacts">
            <div class="card-title-row" onclick="toggleCard('card-contacts')">
                <h2 id="contacts-title">Контакты</h2>
                <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"></polyline></svg>
            </div>
            <div class="description">
                <div id="contacts-text"></div>
                <div class="pdf-download-block">
                    <a href="Resume_Alexander_Masyuk.pdf" download class="pdf-download-btn">
                        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span>Скачать PDF резюме</span>
                    </a>
                </div>
            </div>
        </div>

    </div>

    <!-- Модальное окно просмотра проекта -->
    <div class="modal-overlay" id="projectModal" onclick="closeModal(event)">
        <div class="modal-container" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 class="modal-title" id="modalTitle"></h3>
            <div class="modal-subtitle" id="modalSubtitle"></div>
            <div id="modalTags" class="tags-container"></div>
            <div class="modal-gallery" id="modalGallery"></div>
            <div class="modal-description" id="modalDescription"></div>
            <div id="modalLinkContainer"></div>
        </div>
    </div>

    <button class="floating-collapse-btn" id="floatingBtn" onclick="collapseMostVisibleCard()" title="Свернуть активный блок" aria-label="Свернуть активный блок">
        <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>

    <script>
        let projectsData = [];

        fetch('profile.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-name').textContent = data.name;
                document.getElementById('user-role').textContent = data.role;
                
                // О себе
                document.getElementById('about-title').textContent = data.aboutTitle || "О себе";
                document.getElementById('about-text').innerText = data.aboutText;
                if (data.aboutCollapsed) document.getElementById('card-about').classList.add('collapsed');
                
                // Карьера
                document.getElementById('career-title').textContent = data.careerTitle || "Карьера";
                renderSubmodules('career-list', data.careerItems);
                if (data.careerCollapsed) document.getElementById('card-career').classList.add('collapsed');

                // Мои работы
                document.getElementById('projects-title').textContent = data.projectsTitle || "Мои работы";
                if (data.projectItems) {
                    projectsData = data.projectItems;
                    renderProjectsGrid('projects-list', projectsData);
                }
                if (data.projectsCollapsed) document.getElementById('card-projects').classList.add('collapsed');

                // Контакты
                document.getElementById('contacts-title').textContent = data.contactsTitle || "Контакты";
                const contactsHTML = `
                    <address class="contacts-wrapper">
                        Тел.: <span class="contact-row">
                            <a href="tel:+79511567563">+7 951 156 75 63</a>
                            <button class="copy-btn" onclick="copyToClipboard('+79511567563', this)" title="Скопировать" aria-label="Скопировать номер телефона">
                                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </button>
                            <span class="copy-tooltip">Скопировано!</span>
                        </span><br>
                        E-mail: <span class="contact-row">
                            <a href="mailto:alexander.masyuk@gmail.com">alexander.masyuk@gmail.com</a>
                            <button class="copy-btn" onclick="copyToClipboard('alexander.masyuk@gmail.com', this)" title="Скопировать" aria-label="Скопировать адрес электронной почты">
                                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </button>
                            <span class="copy-tooltip">Скопировано!</span>
                        </span><br>
                        Телеграм: <span class="contact-row">
                            <a href="https://t.me/KlausterHargreeves" target="_blank">@KlausterHargreeves</a>
                            <button class="copy-btn" onclick="copyToClipboard('@KlausterHargreeves', this)" title="Скопировать" aria-label="Скопировать логин Telegram">
                                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </button>
                            <span class="copy-tooltip">Скопировано!</span>
                        </span><br>
                        Предпочтительный способ связи: телеграм, телефон
                    </address>
                `;
                document.getElementById('contacts-text').innerHTML = contactsHTML;
                if (data.contactsCollapsed) document.getElementById('card-contacts').classList.add('collapsed');

                document.title = `${data.name} — ${data.role}`;
                updateFloatingButton();
            })
            .catch(error => {
                console.error('Ошибка загрузки profile.json:', error);
            });

        function renderSubmodules(containerId, items) {
            const container = document.getElementById(containerId);
            if (!items || items.length === 0) return;

            container.innerHTML = items.map(item => {
                const tagsHTML = item.tags ? `<div class="tags-container">${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : '';

if (item.comment) {
    return `
        <div class="submodule-item">
            <div class="submodule-grid">
                <div class="submodule-main">
                    <div class="submodule-header">
                        <div>
                            <div class="submodule-title">${item.title}</div>
                            ${item.subtitle ? `<div class="submodule-subtitle">${item.subtitle}</div>` : ''}
                        </div>
                    </div>
                    <div class="submodule-body">${item.description}</div>
                    ${tagsHTML}
                </div>
                
                <!-- Правая колонка с вынесенной датой -->
                <div class="submodule-side-wrapper">
                    ${item.date ? `<div class="submodule-date-container"><div class="submodule-date">${item.date}</div></div>` : ''}
                    <div class="submodule-comment-side">
                        ${item.comment}
                    </div>
                </div>
            </div>
        </div>
    `;
}

                return `
                    <div class="submodule-item">
                        <div class="submodule-header">
                            <div>
                                <div class="submodule-title">${item.title}</div>
                                ${item.subtitle ? `<div class="submodule-subtitle">${item.subtitle}</div>` : ''}
                            </div>
                            ${item.date ? `<div class="submodule-date">${item.date}</div>` : ''}
                        </div>
                        <div class="submodule-body">${item.description}</div>
                        ${tagsHTML}
                    </div>
                `;
            }).join('');
        }

        function renderProjectsGrid(containerId, projects) {
            const container = document.getElementById(containerId);
            if (!projects || projects.length === 0) return;

            container.innerHTML = projects.map((item, index) => {
                const tagsHTML = item.tags ? `<div class="tags-container">${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : '';
                const imgHTML = item.previewImg ? `<img src="${item.previewImg}" alt="${item.title}" class="project-card-image">` : '';

                return `
                    <div class="project-card" onclick="openModal(${index})">
                        ${imgHTML}
                        <div class="project-card-content">
                            <div class="project-card-title">${item.title}</div>
                            ${item.subtitle ? `<div class="project-card-subtitle">${item.subtitle}</div>` : ''}
                            <div class="project-card-desc">${item.description}</div>
                            ${tagsHTML}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(index) {
            const project = projectsData[index];
            if (!project) return;

            document.getElementById('modalTitle').textContent = project.title;
            document.getElementById('modalSubtitle').textContent = `${project.subtitle || ''} ${project.date ? '• ' + project.date : ''}`;
            
            const modalTags = document.getElementById('modalTags');
            modalTags.innerHTML = project.tags ? project.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';

            const modalGallery = document.getElementById('modalGallery');
            modalGallery.innerHTML = project.modalImages ? project.modalImages.map(img => `<img src="${img}" alt="Скриншот проекта">`).join('') : '';

            document.getElementById('modalDescription').innerText = project.fullDescription || project.description;

            const linkContainer = document.getElementById('modalLinkContainer');
            if (project.link) {
                linkContainer.innerHTML = `<a href="${project.link}" target="_blank" class="modal-link-btn">Перейти к проекту &rarr;</a>`;
            } else {
                linkContainer.innerHTML = '';
            }

            document.getElementById('projectModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('projectModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const tooltip = btnElement.nextElementSibling;
                if (tooltip) {
                    tooltip.classList.add('show');
                    setTimeout(() => tooltip.classList.remove('show'), 1500);
                }
            });
        }

        function scrollToCard(cardId) {
            const card = document.getElementById(cardId);
            if (card) {
                if (card.classList.contains('collapsed')) card.classList.remove('collapsed');
                card.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function toggleCard(cardId) {
            const card = document.getElementById(cardId);
            card.classList.toggle('collapsed');
            updateFloatingButton();
        }

        function getMostVisibleExpandedCard() {
            const cards = document.querySelectorAll('.card-collapsible:not(.collapsed)');
            let maxVisibleHeight = 0;
            let targetCard = null;

            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const visibleTop = Math.max(0, rect.top);
                const visibleBottom = Math.min(window.innerHeight, rect.bottom);
                const visibleHeight = Math.max(0, visibleBottom - visibleTop);

                if (visibleHeight > maxVisibleHeight) {
                    maxVisibleHeight = visibleHeight;
                    targetCard = card;
                }
            });

            return { targetCard, maxVisibleHeight };
        }

        function updateFloatingButton() {
            const btn = document.getElementById('floatingBtn');
            const { targetCard, maxVisibleHeight } = getMostVisibleExpandedCard();

            if (targetCard && maxVisibleHeight > 100) {
                btn.classList.add('visible');
            } else {
                btn.classList.remove('visible');
            }
        }

        function collapseMostVisibleCard() {
            const { targetCard } = getMostVisibleExpandedCard();
            if (targetCard) {
                targetCard.classList.add('collapsed');
                updateFloatingButton();
            }
        }

        let ticking = false;

        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    onScrollUpdate();
                    ticking = false;
                });
                ticking = true;
            }
        });

        function onScrollUpdate() {
            const scrolled = window.scrollY;
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            
            document.getElementById("progressBar").style.width = ((winScroll / height) * 100) + "%";

            const sq1 = document.querySelector('.square-1');
            const sq2 = document.querySelector('.square-2');
            const gp1 = document.querySelector('.gamepad-1');
            const gp2 = document.querySelector('.gamepad-2');

            if (sq1) sq1.style.transform = `translate3d(0, ${scrolled * 0.22}px, 0) rotate(${20 + scrolled * 0.03}deg)`;
            if (sq2) sq2.style.transform = `translate3d(0, ${-scrolled * 0.18}px, 0) rotate(${-15 - scrolled * 0.02}deg)`;
            if (gp1) gp1.style.transform = `translate3d(0, ${-scrolled * 0.15}px, 0) rotate(${-12 + scrolled * 0.04}deg)`;
            if (gp2) gp2.style.transform = `translate3d(0, ${scrolled * 0.2}px, 0) rotate(${25 - scrolled * 0.03}deg)`;

            updateFloatingButton();
        }
    </script>
</body>
</html>
