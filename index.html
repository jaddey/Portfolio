<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Александер Масюк — Technical Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1b1e24;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Главная сетка */
        .grid-container {
            display: grid;
            grid-template-columns: 320px 1fr; /* Левая колонка под фото, правая под контент */
            grid-template-rows: auto auto;
            gap: 1.5rem;
            max-width: 1000px;
            width: 100%;
        }

        /* Базовый стиль карточек (немного темнее фона + граница) */
        .card {
            background-color: #15171c;
            border: 1px solid #2e333d;
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Карточка 1: Фото (занимает 2 строки по высоте) */
        .card-photo {
            grid-row: span 2;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Карточка 2: Имя и Профессия */
        .card-header {
            text-align: left;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #106b6e;
            font-weight: 600;
        }

        /* Карточка 3: О себе */
        .card-about {
            text-align: left;
        }

        .card-about h2 {
            font-size: 1.1rem;
            color: #106b6e;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        p.description {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* Адаптив для мобильных устройств */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .card-photo {
                grid-row: span 1;
                height: 350px;
            }
        }
    </style>
</head>
<body>

    <div class="grid-container">
        
        <!-- Белый блок: Фото -->
        <div class="card card-photo">
            <img src="photo.jpg" alt="Александер Масюк" class="profile-img">
        </div>

        <!-- Жёлтый блок: Имя и Профессия -->
        <div class="card card-header">
            <h1>Александер Масюк</h1>
            <div class="subtitle">Technical Designer</div>
        </div>

        <!-- Красный блок: О себе -->
        <div class="card card-about">
            <h2>О себе</h2>
            <p class="description">
                Разрабатываю интерактивные презентации, визуальные механики и инструменты на Unity & C#.
            </p>
        </div>

    </div>

</body>
</html>
