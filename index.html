<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — Technical Designer</title>
    
    <!-- Подключение файла с палитрой цветов -->
    <link rel="stylesheet" href="theme.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-body);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        .bg-dots {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--bg-dots-color) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        .shape-square {
            filter: blur(20px);
            opacity: 0.18;
            border: 1px solid var(--border-color);
            border-radius: 32px;
            background: linear-gradient(135deg, var(--accent-dark), transparent);
        }

        .square-1 {
            width: 550px;
            height: 550px;
            top: -100px;
            left: -180px;
            transform: rotate(20deg);
        }

        .square-2 {
            width: 450px;
            height: 450px;
            bottom: -100px;
            right: -100px;
            transform: rotate(-15deg);
        }

        .shape-gamepad {
            filter: blur(12px);
            opacity: 0.16;
            stroke: var(--border-color);
            stroke-width: 1.5;
        }

        .gamepad-1 {
            top: 20%;
            right: 5%;
            width: 480px;
            height: auto;
            fill: url(#gamepad-grad-1);
        }

        .gamepad-2 {
            bottom: 15%;
            left: -50px;
            width: 400px;
            height: auto;
            fill: url(#gamepad-grad-2);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
        }

        .card-photo {
            padding: 0;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-header {
            text-align: left;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--accent-primary);
            font-weight: 600;
        }

        .card-full-width {
            grid-column: span 2;
            text-align: left;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
            width: fit-content;
        }

        h2 {
            font-size: 1.1rem;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
        }

        .toggle-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--accent-primary);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .description {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-line;
            max-height: 2000px;
            opacity: 1;
            overflow: hidden;
            margin-top: 0.75rem;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
        }

        .description a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .description a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .card-collapsible.collapsed .description {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        .card-collapsible.collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        .floating-collapse-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--accent-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.2s ease, background-color 0.2s ease;
        }

        .floating-collapse-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .floating-collapse-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .floating-collapse-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .card-full-width {
                grid-column: span 1;
            }

            .card-photo {
                max-width: 250px;
                margin: 0 auto;
            }

            .gamepad-1 {
                width: 320px;
                right: -60px;
            }

            .gamepad-2 {
                width: 280px;
                left: -60px;
            }

            .floating-collapse-btn {
                bottom: 1.5rem;
                right: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <svg style="width:0; height:0; position:absolute;" aria-hidden="true">
        <defs>
            <linearGradient id="gamepad-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--accent-primary)" stop-opacity="0.9" />
                <stop offset="100%" stop-color="var(--accent-primary)" stop-opacity="0.1" />
            </linearGradient>
            <linearGradient id="gamepad-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="var(--accent-primary)" stop-opacity="0.8" />
                <stop offset="100%" stop-color="var(--accent-primary)" stop-opacity="0.2" />
            </linearGradient>
        </defs>
    </svg>

    <div class="bg-dots"></div>
    <div class="bg-shape shape-square square-1"></div>
    <div class="bg-shape shape-square square-2"></div>

    <svg class="bg-shape shape-gamepad gamepad-1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path d="M362.7 128H149.3C102.5 128 64 166.5 64 213.3v132.3c0 23 15.6 42.6 38.2 47.1l42.7 8.5c18.5 3.7 36.3-8.8 39.5-27.4l11.2-64.8c1.8-10.4 10.8-18 21.4-18h78.1c10.5 0 19.6 7.6 21.4 18l11.2 64.8c3.2 18.6 21 31.1 39.5 27.4l42.7-8.5c22.6-4.5 38.2-24.1 38.2-47.1V213.3c0-46.8-38.5-85.3-85.3-85.3zM170.7 245.3h-21.3v21.3c0 5.9-4.8 10.7-10.7 10.7s-10.7-4.8-10.7-10.7v-21.3h-21.3c-5.9 0-10.7-4.8-10.7-10.7s4.8-10.7 10.7-10.7h21.3v-21.3c0-5.9 4.8-10.7 10.7-10.7s10.7 4.8 10.7 10.7v21.3h21.3c5.9 0 10.7 4.8 10.7 10.7s-4.8 10.7-10.7 10.7zm170.7 21.3c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3zm42.7-42.7c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3z"/>
    </svg>

    <svg class="bg-shape shape-gamepad gamepad-2" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path d="M362.7 128H149.3C102.5 128 64 166.5 64 213.3v132.3c0 23 15.6 42.6 38.2 47.1l42.7 8.5c18.5 3.7 36.3-8.8 39.5-27.4l11.2-64.8c1.8-10.4 10.8-18 21.4-18h78.1c10.5 0 19.6 7.6 21.4 18l11.2 64.8c3.2 18.6 21 31.1 39.5 27.4l42.7-8.5c22.6-4.5 38.2-24.1 38.2-47.1V213.3c0-46.8-38.5-85.3-85.3-85.3zM170.7 245.3h-21.3v21.3c0 5.9-4.8 10.7-10.7 10.7s-10.7-4.8-10.7-10.7v-21.3h-21.3c-5.9 0-10.7-4.8-10.7-10.7s4.8-10.7 10.7-10.7h21.3v-21.3c0-5.9 4.8-10.7 10.7-10.7s10.7 4.8 10.7 10.7v21.3h21.3c5.9 0 10.7 4.8 10.7 10.7s-4.8 10.7-10.7 10.7zm170.7 21.3c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3zm42.7-42.7c-11.8 0-21.3-9.5-21.3-21.3s9.5-21.3 21.3-21.3 21.3 9.5 21.3 21.3-9.5 21.3-21.3 21.3z"/>
    </svg>

    <div class="grid-container">
        
        <div class="card card-photo">
            <img src="photo.jpg" alt="Александер Масюк" class="profile-img">
        </div>

        <div class="card card-header">
            <h1 id="user-name">...</h1>
            <div class="subtitle" id="user-role">...</div>
        </div>

        <div class="card card-full-width card-collapsible" id="card-about">
            <div class="card-title-row" onclick="toggleCard('card-about')">
                <h2 id="about-title">...</h2>
                <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="description" id="about-text"></div>
        </div>

        <div class="card card-full-width card-collapsible" id="card-experience">
            <div class="card-title-row" onclick="toggleCard('card-experience')">
                <h2 id="experience-title">...</h2>
                <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="description" id="experience-text"></div>
        </div>

        <div class="card card-full-width card-collapsible" id="card-contacts">
            <div class="card-title-row" onclick="toggleCard('card-contacts')">
                <h2 id="contacts-title">...</h2>
                <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="description" id="contacts-text"></div>
        </div>

    </div>

    <button class="floating-collapse-btn" id="floatingBtn" onclick="collapseMostVisibleCard()" title="Свернуть активный блок">
        <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>

    <script>
        fetch('profile.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-name').textContent = data.name;
                document.getElementById('user-role').textContent = data.role;
                
                document.getElementById('about-title').textContent = data.aboutTitle;
                document.getElementById('about-text').innerText = data.aboutText;
                if (data.aboutCollapsed) document.getElementById('card-about').classList.add('collapsed');
                
                document.getElementById('experience-title').textContent = data.experienceTitle;
                document.getElementById('experience-text').innerText = data.experienceText;
                if (data.experienceCollapsed) document.getElementById('card-experience').classList.add('collapsed');
                
                document.getElementById('contacts-title').textContent = data.contactsTitle;
                document.getElementById('contacts-text').innerHTML = data.contactsText;
                if (data.contactsCollapsed) document.getElementById('card-contacts').classList.add('collapsed');

                document.title = `${data.name} — ${data.role}`;
                updateFloatingButton();
            })
            .catch(error => {
                console.error('Ошибка загрузки profile.json:', error);
            });

        function toggleCard(cardId) {
            const card = document.getElementById(cardId);
            card.classList.toggle('collapsed');
            updateFloatingButton();
        }

        function getMostVisibleExpandedCard() {
            const cards = document.querySelectorAll('.card-collapsible:not(.collapsed)');
            let maxVisibleHeight = 0;
            let targetCard = null;

            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const visibleTop = Math.max(0, rect.top);
                const visibleBottom = Math.min(window.innerHeight, rect.bottom);
                const visibleHeight = Math.max(0, visibleBottom - visibleTop);

                if (visibleHeight > maxVisibleHeight) {
                    maxVisibleHeight = visibleHeight;
                    targetCard = card;
                }
            });

            return { targetCard, maxVisibleHeight };
        }

        function updateFloatingButton() {
            const btn = document.getElementById('floatingBtn');
            const { targetCard, maxVisibleHeight } = getMostVisibleExpandedCard();

            if (targetCard && maxVisibleHeight > 100) {
                btn.classList.add('visible');
            } else {
                btn.classList.remove('visible');
            }
        }

        function collapseMostVisibleCard() {
            const { targetCard } = getMostVisibleExpandedCard();
            if (targetCard) {
                targetCard.classList.add('collapsed');
                updateFloatingButton();
            }
        }

        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;

            const sq1 = document.querySelector('.square-1');
            const sq2 = document.querySelector('.square-2');
            const gp1 = document.querySelector('.gamepad-1');
            const gp2 = document.querySelector('.gamepad-2');

            if (sq1) sq1.style.transform = `translateY(${scrolled * 0.22}px) rotate(${20 + scrolled * 0.03}deg)`;
            if (sq2) sq2.style.transform = `translateY(${-scrolled * 0.18}px) rotate(${-15 - scrolled * 0.02}deg)`;
            if (gp1) gp1.style.transform = `translateY(${-scrolled * 0.15}px) rotate(${-12 + scrolled * 0.04}deg)`;
            if (gp2) gp2.style.transform = `translateY(${scrolled * 0.2}px) rotate(${25 - scrolled * 0.03}deg)`;

            updateFloatingButton();
        });
    </script>

</body>
</html>
