<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — Technical Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1b1e24;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Главная сетка */
        .grid-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: auto auto;
            gap: 1.5rem;
            max-width: 1000px;
            width: 100%;
        }

        /* Стиль карточек */
        .card {
            background-color: #15171c;
            border: 1px solid #2e333d;
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Фото */
        .card-photo {
            grid-row: span 2;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Имя и Профессия */
        .card-header {
            text-align: left;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #106b6e;
            font-weight: 600;
        }

        /* О себе */
        .card-about {
            text-align: left;
        }

        .card-about h2 {
            font-size: 1.1rem;
            color: #106b6e;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        p.description {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* Мобильная адаптивность */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .card-photo {
                grid-row: span 1;
                height: 350px;
            }
        }
    </style>
</head>
<body>

    <div class="grid-container">
        
        <!-- Карточка: Фото -->
        <div class="card card-photo">
            <img src="photo.jpg" alt="Александер Масюк" class="profile-img">
        </div>

        <!-- Карточка: Имя и Профессия -->
        <div class="card card-header">
            <h1 id="user-name">...</h1>
            <div class="subtitle" id="user-role">...</div>
        </div>

        <!-- Карточка: О себе -->
        <div class="card card-about">
            <h2 id="about-title">...</h2>
            <p class="description" id="about-text">...</p>
        </div>

    </div>

    <!-- Скрипт подгрузки данных из profile.json -->
    <script>
        fetch('profile.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-name').textContent = data.name;
                document.getElementById('user-role').textContent = data.role;
                document.getElementById('about-title').textContent = data.aboutTitle;
                document.getElementById('about-text').textContent = data.aboutText;
                
                // Также динамически меняем заголовок вкладки браузера
                document.title = `${data.name} — ${data.role}`;
            })
            .catch(error => {
                console.error('Ошибка загрузки данных:', error);
            });
    </script>

</body>
</html>
